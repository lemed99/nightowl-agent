name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, zlib
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  integration:
    # Both storage families, because the drain writes only one of them and a
    # read against the other returns zero rows rather than an error — a v2
    # regression looks exactly like a slow drain. v1 is not legacy here: it is
    # what un-migrated tenants run and what the NIGHTOWL_STORAGE_V2 kill switch
    # falls back to, so it has to stay green on its own.
    name: Integration Tests (storage ${{ matrix.storage }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        storage: ['v2', 'v1']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nightowl_test
          POSTGRES_USER: nightowl_test
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pcntl + posix are what the System suite forks the real agent with.
          # Named explicitly rather than relied on: without them every System
          # test calls markTestSkipped and the leg goes green having asserted
          # nothing about either storage family.
          extensions: pdo_sqlite, pdo_pgsql, zlib, pcntl, posix
          coverage: none

      - name: Assert the System suite can actually run
        run: php -r 'exit((int) ! (extension_loaded("pcntl") && extension_loaded("posix")));'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run all tests (unit + integration + system)
        env:
          NIGHTOWL_TEST_DB_HOST: 127.0.0.1
          NIGHTOWL_TEST_DB_PORT: 5432
          NIGHTOWL_TEST_DB_DATABASE: nightowl_test
          NIGHTOWL_TEST_DB_USERNAME: nightowl_test
          NIGHTOWL_TEST_DB_PASSWORD: test123
          # Overrides phpunit.xml's non-forced <env> pin. Read by the System
          # harness subprocess AND by ReadsRawFamily, so the daemon writes and
          # the assertions read the same family.
          NIGHTOWL_STORAGE_V2: ${{ matrix.storage == 'v2' }}
        run: vendor/bin/phpunit
